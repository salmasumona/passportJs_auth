<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Login</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="card">
      <h1>Login</h1>
      <form id="login">
        <input
          name="username"
          placeholder="Username or email"
          required
          minlength="4"
        /><input
          name="password"
          type="password"
          placeholder="Password"
          required
        /><button>Login</button>
      </form>
      <p id="message"></p>
      <a href="/register.html">Create an account</a>
    </main>
    <script src="/auth.js"></script>
  </body>
</html>
