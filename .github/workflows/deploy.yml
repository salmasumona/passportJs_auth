name: CI/CD - Passport Auth to AWS EC2

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: passport-auth-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Syntax check
        run: npm run check

      - name: Run tests
        run: npm test

      - name: Dependency audit
        run: npm audit --audit-level=high

  deploy:
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy to EC2 with automatic rollback
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: ${{ secrets.EC2_PORT || 22 }}
          script: |
            cd /var/www/passportJs_auth
            bash scripts/deploy.sh
