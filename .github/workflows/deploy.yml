name: CI/CD - Passport Auth to AWS EC2

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Syntax check
        run: npm run check

      - name: Run tests
        run: npm test

  deploy:
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy to EC2 over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: ${{ secrets.EC2_PORT || 22 }}
          script: |
            cd /var/www/passportJs_auth
            git fetch origin master
            git reset --hard origin/master
            npm ci --omit=dev
            chmod 600 .env
            pm2 startOrRestart ecosystem.config.js --update-env
            pm2 save
            echo "Waiting for application health..."
            for i in {1..12}; do
              if curl -fsS http://127.0.0.1:1800/health; then
                echo "Application is healthy."
                exit 0
              fi
              echo "Health check attempt $i failed; retrying in 5 seconds..."
              sleep 5
            done
            echo "Application failed health check."
            pm2 status
            pm2 logs passport-auth --lines 100 --nostream
            exit 1
