services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: passport-auth:local
    container_name: passport-auth
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 1800
    ports:
      - "1800:1800"
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:1800/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
